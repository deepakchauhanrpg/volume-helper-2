<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Helper Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary-color: #800000;
            --primary-hover: #600000;
            --bg-gradient: linear-gradient(135deg, #800000 0%, #2b0000 100%);
            --surface-color: #ffffff;
            --text-color: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.15), 0 10px 10px -5px rgba(0,0,0,0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-gradient); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; color: var(--text-color); }
        
        /* Premium Card Layout */
        .container { background: var(--surface-color); width: 100%; max-width: 480px; padding: 24px; border-radius: 32px; box-shadow: var(--shadow-lg); position: relative; }
        
        /* Strict Screen Display Isolation */
        #authScreen { display: block; text-align: center; padding: 10px 5px; }
        #appScreen { display: none; }

        /* Premium Security Form Design */
        .lock-icon { width: 75px; height: 75px; background: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; color: white; font-size: 32px; box-shadow: 0 8px 16px rgba(128,0,0,0.2); }
        .auth-title { font-size: 26px; font-weight: 700; color: var(--primary-color); margin-bottom: 6px; letter-spacing: -0.5px; }
        .auth-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; font-weight: 500; }
        
        .input-group { position: relative; margin-bottom: 24px; display: flex; align-items: center; width: 100%; }
        .input-group i.fa-lock { position: absolute; left: 18px; color: var(--text-muted); z-index: 2; font-size: 18px; }
        .input-group .toggle-pass { position: absolute; right: 18px; color: var(--text-muted); cursor: pointer; z-index: 2; font-size: 18px; }
        .input-group input { width: 100%; padding: 16px 50px 16px 48px; border: 2px solid var(--border-color); border-radius: 18px; font-size: 15px; font-weight: 500; outline: none; transition: 0.3s; background: #f8fafc; }
        .input-group input:focus { border-color: var(--primary-color); background: #ffffff; box-shadow: 0 0 0 4px rgba(128,0,0,0.1); }
        
        /* Master Application UI Components */
        .app-header { text-align: center; margin-bottom: 24px; }
        .app-title { font-size: 26px; font-weight: 700; color: var(--primary-color); display: flex; justify-content: center; align-items: center; gap: 12px; letter-spacing: -0.5px; }
        
        .section-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 12px; display: block; text-align: left; }
                /* High-End Length Selection Chips */
        .length-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
        .chip { border: 2px solid var(--border-color); padding: 12px 6px; border-radius: 16px; text-align: center; font-weight: 700; cursor: pointer; user-select: none; transition: all 0.2s ease; font-size: 14px; background: #ffffff; box-shadow: var(--shadow-sm); color: var(--text-color); }
        .chip.selected { background: var(--primary-color); color: #ffffff; border-color: var(--primary-color); box-shadow: 0 6px 12px rgba(128,0,0,0.25); }
        
        /* Smooth Mobile Form Fields (Makkhan Inputs) */
        .form-row { display: flex; gap: 16px; margin-bottom: 22px; }
        .form-row .field { flex: 1; text-align: left; }
        .field label { font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 8px; }
        .field input { width: 100%; padding: 14px 16px; border: 2px solid var(--border-color); border-radius: 16px; font-size: 15px; font-weight: 600; outline: none; color: #1e293b; background: #ffffff; transition: all 0.3s ease; box-shadow: var(--shadow-sm); }
        .field input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(128,0,0,0.1); }
        
        /* Soft-Rounded Tree Configuration Block */
        .tree-input-box { background: #fffdf5; border: 2px dashed #eab308; padding: 18px; border-radius: 20px; margin-bottom: 26px; text-align: left; box-shadow: var(--shadow-sm); }
        .tree-input-box label { font-size: 13px; font-weight: 700; color: #a16207; display: block; margin-bottom: 8px; }
        .tree-input-box input { width: 100%; padding: 12px 16px; border: 2px solid #fef08a; border-radius: 14px; outline: none; font-size: 15px; font-weight: 600; margin-bottom: 14px; box-shadow: var(--shadow-sm); background: #ffffff; color: #a16207; }
        .tree-input-box input:focus { border-color: #eab308; box-shadow: 0 0 0 4px rgba(234,179,8,0.15); }
        .tree-range-row { display: flex; gap: 12px; }
        .tree-range-row .range-field { flex: 1; }
        .tree-range-row .range-field label { font-size: 11px; font-weight: 700; color: #a16207; margin-bottom: 6px; }
        .tree-range-row .range-field input { padding: 10px 12px; font-size: 14px; margin-bottom: 0; }
        .tree-input-box .hint { font-size: 11px; color: #ca8a04; display: block; margin-top: 6px; font-weight: 500; }

        /* Actions Framework */
        .btn { width: 100%; padding: 16px; border: none; border-radius: 18px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: var(--shadow-md); }
        .btn-primary { background: var(--primary-color); color: white; margin-bottom: 16px; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: #16a34a; color: white; display: none; margin-bottom: 24px; }
        .btn-success:hover { background: #15803d; }
        
        .summary-box { background: #f8fafc; border: 2px solid #e2e8f0; padding: 16px; border-radius: 18px; font-size: 14px; font-weight: 700; margin-bottom: 24px; white-space: pre-line; display: none; border-left: 6px solid var(--primary-color); text-align: left; color: #1e293b; box-shadow: var(--shadow-sm); }
        
        /* Premium Cards UI Look for Lists */
        .tree-block { background: #fffafb; border: 2px solid #fee2e2; border-radius: 22px; padding: 18px; margin-bottom: 24px; box-shadow: var(--shadow-md); text-align: left; }
        .tree-header { font-size: 16px; font-weight: 700; color: var(--primary-color); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px dashed #fca5a5; padding-bottom: 8px; }
        .tree-footer { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--primary-color); background: #ffe4e6; padding: 10px 14px; border-radius: 12px; margin-top: 14px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 14px; }
        th { background: #ffe4e6; color: var(--primary-color); text-align: left; padding: 10px; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        th:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
        th:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; font-weight: 600; color: #334155; }
        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) td { background: #fffdfd; }
        
        .normal-table-wrap { max-height: 380px; overflow-y: auto; border: 2px solid #e2e8f0; border-radius: 18px; margin-bottom: 24px; text-align: left; box-shadow: var(--shadow-sm); }
        .normal-table-wrap table th { position: sticky; top: 0; background: #ffe4e6; z-index: 1; }
        
        #loadingMsg { display: none; text-align: center; font-weight: 700; color: var(--primary-color); margin-bottom: 16px; font-size: 15px; }
        .footer-credit { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 24px; font-weight: 600; border-top: 2px dashed #f1f5f9; padding-top: 18px; }
    </style>
</head>
<body>

<div class="container">
    <div id="authScreen">
        <div class="lock-icon"><i class="fa-solid fa-lock"></i></div>
        <h2 class="auth-title">Volume Helper Pro</h2>
        <p class="auth-subtitle">Apna password enter karein</p>
        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="passwordInput" placeholder="Password yahan likhein">
            <i class="fa-solid fa-eye toggle-pass" onclick="togglePasswordView()"></i>
        </div>
        <button class="btn btn-primary" onclick="checkAuth()">Login</button>
    </div>

    <div id="appScreen">
        <div class="app-header">
            <h2 class="app-title">🪵 Volume Helper Pro</h2>
        </div>

        <span class="section-label">Length (A) Select Karo:</span>
        <div class="length-grid" id="lengthGrid"></div>

        <div class="form-row">
            <div class="field">
                <label for="minB">Min Girth (B)</label>
                <input type="number" id="minB" step="0.01" value="0.31">
            </div>
            <div class="field">
                <label for="maxB">Max Girth (B)</label>
                <input type="number" id="maxB" step="0.01" value="2.00">
            </div>
        </div>

        <div class="form-row">
            <div class="field">
                <label for="target">Target Volume (C)</label>
                <input type="number" id="target" step="0.0001" placeholder="e.g. 150.45">
            </div>
            <div class="field">
                <label for="totalLogs">Total Logs Count</label>
                <input type="number" id="totalLogs" placeholder="e.g. 200">
            </div>
        </div>

        <div class="tree-input-box">
            <label for="numTrees">🌲 Number of Trees (Optional)</label>
            <input type="number" id="numTrees" placeholder="e.g. 15">
            
            <div class="tree-range-row">
                <div class="range-field">
                    <label for="minLogsTree">Min Logs Per Tree</label>
                    <input type="number" id="minLogsTree" value="2" placeholder="Min">
                </div>
                <div class="range-field">
                    <label for="maxLogsTree">Max Logs Per Tree</label>
                    <input type="number" id="maxLogsTree" value="6" placeholder="Max">
                </div>
            </div>
            <span class="hint">💡 Khaali chhodne par bina tree ke normal list banegi</span>
        </div>

        <div id="loadingMsg"><i class="fa-solid fa-spinner fa-spin"></i> Processing calculation...</div>
        
        <button class="btn btn-primary" id="generateBtn" onclick="generateVolumeList()">
            <i class="fa-solid fa-layer-group"></i> Generate List
        </button>
        
        <div class="summary-box" id="summaryBox"></div>
        
        <button class="btn btn-success" id="downloadBtn" onclick="downloadPDF()">
            <i class="fa-solid fa-file-pdf"></i> Download PDF
        </button>

        <div id="tableWrapper"></div>

        <div class="footer-credit">Designed by Deepak Chauhan | Specially for Anjali Gangwar ❤️</div>
    </div>
</div>
<script>
    var AUTH_KEY  = "Anjali143"; 
    var SHEET_URL = "https://script.google.com/macros/s/AKfycbyb55gXpXv_j2lH_S_z2lK6C_qg6m7bV9H8W7Y1/exec"; 

    var defaultLengths = [0.95, 1.25, 1.55, 1.85, 2.15, 2.45, 2.75, 3.05, 3.35];
    var selectedLengths = [0.95, 1.25, 1.55, 1.85, 2.15, 2.45, 2.75, 3.05, 3.35];
    var structuredTreeData = [];
    var displayGrandSummary = "";

    window.onload = function() {
        renderChips();
    };

    function togglePasswordView() {
        var el = document.getElementById('passwordInput');
        el.type = (el.type === 'password') ? 'text' : 'password';
    }

    function checkAuth() {
        var input = document.getElementById('passwordInput').value.trim();
        if(input === AUTH_KEY) {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
        } else {
            alert("Galat Password Hai Bhai!");
        }
    }

    function renderChips() {
        var grid = document.getElementById('lengthGrid');
        grid.innerHTML = '';
        defaultLengths.forEach(function(val) {
            var chip = document.createElement('div');
            chip.className = 'chip selected';
            chip.innerText = val.toFixed(2);
            chip.onclick = function() {
                if(chip.classList.contains('selected')) {
                    chip.classList.remove('selected');
                    selectedLengths = selectedLengths.filter(function(v) { return v !== val; });
                } else {
                    chip.classList.add('selected');
                    selectedLengths.push(val);
                }
            };
            grid.appendChild(chip);
        });
    }

    function getSelectedLengths() {
        return selectedLengths.length > 0 ? selectedLengths : defaultLengths;
    }

    function truncDec(num, dec) {
        var calc = Math.pow(10, dec);
        return (Math.trunc(num * calc) / calc).toFixed(dec);
    }

    function generateVolumeList() {
        var target    = parseFloat(document.getElementById('target').value);
        var totalLogs = parseInt(document.getElementById('totalLogs').value);
        var minG      = parseFloat(document.getElementById('minB').value);
        var maxG      = parseFloat(document.getElementById('maxB').value);

        if(isNaN(target) || isNaN(totalLogs) || isNaN(minG) || isNaN(maxG)) {
            alert("Saari fields sahi se fill karo bhai!");
            return;
        }

        document.getElementById('loadingMsg').style.display = 'block';
        document.getElementById('summaryBox').style.display = 'none';
        document.getElementById('downloadBtn').style.display = 'none';
        document.getElementById('tableWrapper').innerHTML = '';

        var aVals = getSelectedLengths();
        trackUsage(aVals, target, totalLogs);

        setTimeout(function() {
            runHighPrecisionEngine(target, totalLogs, minG, maxG, aVals);
        }, 150);
    }
        function runHighPrecisionEngine(target, totalLogs, minG, maxG, aVals) {
        var numTreesVal = document.getElementById('numTrees').value.trim();
        var treeMode    = numTreesVal !== '';
        var totalTrees = treeMode ? parseInt(numTreesVal) : 1;

        var minLogsAllowed = parseInt(document.getElementById('minLogsTree').value) || 2;
        var maxLogsAllowed = parseInt(document.getElementById('maxLogsTree').value) || 6;

        var treeLogsDistribution = [];
        if(treeMode) {
            var currentAllocated = 0;
            for(var t=0; t<totalTrees; t++) {
                var randomL = Math.floor(Math.random() * (maxLogsAllowed - minLogsAllowed + 1)) + minLogsAllowed;
                treeLogsDistribution.push(randomL);
                currentAllocated += randomL;
            }

            var safetyLoop = 0;
            while(currentAllocated !== totalLogs && safetyLoop < 2000) {
                safetyLoop++;
                for(var t=0; t<totalTrees; t++) {
                    if(currentAllocated === totalLogs) break;
                    
                    if(currentAllocated < totalLogs && treeLogsDistribution[t] < maxLogsAllowed) {
                        treeLogsDistribution[t]++;
                        currentAllocated++;
                    } else if(currentAllocated > totalLogs && treeLogsDistribution[t] > minLogsAllowed) {
                        treeLogsDistribution[t]--;
                        currentAllocated--;
                    }
                }
            }

            if(currentAllocated !== totalLogs) {
                document.getElementById('loadingMsg').style.display = 'none';
                calculateFallback();
                return;
            }
        } else {
            treeLogsDistribution.push(totalLogs);
        }

        var processingSuccess = false;
        var tempStructuredData = [];
        var currentVolSum = 0;
        var logGlobalCounter = 0;

        for (var attempt = 0; attempt < 600; attempt++) {
            currentVolSum = 0;
            logGlobalCounter = 0;
            tempStructuredData = [];
            var isGenerationValid = true;

            for (var t = 0; t < totalTrees; t++) {
                var currentTreeLogLimit = treeLogsDistribution[t];
                var treeLogsArray = [];
                var treeVolSum = 0;

                for (var l = 0; l < currentTreeLogLimit; l++) {
                    logGlobalCounter++;
                    var randomA = aVals[Math.floor(Math.random() * aVals.length)];
                    var remLogs = totalLogs - logGlobalCounter;
                    var remVol = target - currentVolSum;
                    
                    var minPossibleB = minG, maxPossibleB = maxG;
                    if (remLogs > 0) {
                        var avgFutureA = 2.15;
                        var neededAvgB = Math.sqrt((remVol * 16) / (remLogs * avgFutureA));
                        minPossibleB = Math.max(minG, neededAvgB - 0.25);
                        maxPossibleB = Math.min(maxG, neededAvgB + 0.25);
                        if(minPossibleB > maxPossibleB) { minPossibleB = minG; maxPossibleB = maxG; }
                    }

                    var randomB = Math.random() * (maxPossibleB - minPossibleB) + minPossibleB;
                    randomB = parseFloat(randomB.toFixed(2));
                    var calcC = truncDec((randomA * Math.pow(randomB, 2)) / 16, 4);

                    if (logGlobalCounter === totalLogs) {
                        var finalNeededC = target - currentVolSum;
                        if (finalNeededC < 0.0005) { isGenerationValid = false; break; }
                        
                        calcC = truncDec(finalNeededC, 4);
                        var reqB = Math.sqrt((finalNeededC * 16) / randomA);
                        if (reqB < minG || reqB > maxG) { isGenerationValid = false; break; }
                        randomB = parseFloat(reqB.toFixed(2));
                    }

                    currentVolSum += parseFloat(calcC);
                    treeVolSum += parseFloat(calcC);

                    treeLogsArray.push({ index: logGlobalCounter, length: randomA, girth: randomB.toFixed(2), volume: calcC });
                }

                if (!isGenerationValid) break;
                tempStructuredData.push({ treeNum: t + 1, logsCount: currentTreeLogLimit, totalVolume: truncDec(treeVolSum, 4), logs: treeLogsArray });
            }

            if (isGenerationValid && Math.abs(currentVolSum - target) < 0.0005) {
                structuredTreeData = tempStructuredData;
                displayGrandSummary = '✅ Total Logs: ' + totalLogs + ' | Total Volume: ' + truncDec(currentVolSum, 4) + ' m³';
                processingSuccess = true;
                break;
            }
        }

        if (processingSuccess) {
            var wrapper = document.getElementById('tableWrapper');
            wrapper.innerHTML = '';

            for (var t = 0; t < totalTrees; t++) {
                var tData = structuredTreeData[t];
                if (treeMode) {
                    var treeBlock = document.createElement('div');
                    treeBlock.className = 'tree-block';
                    var hdr = document.createElement('div'); hdr.className = 'tree-header'; hdr.innerHTML = '<span class="icon">🌳</span> Tree ' + tData.treeNum; treeBlock.appendChild(hdr);
                    var tbl = document.createElement('table'); tbl.innerHTML = '<thead><tr><th># Serial</th><th>Length (A)</th><th>Girth (B)</th><th>Volume (C)</th></tr></thead>';
                    var tbody = document.createElement('tbody');
                    tData.logs.forEach(function(log) {
                        var tr = document.createElement('tr'); tr.innerHTML = '<td>' + log.index + '</td><td>' + log.length + '</td><td>' + log.girth + '</td><td>' + log.volume + '</td>'; tbody.appendChild(tr);
                    });
                    tbl.appendChild(tbody); treeBlock.appendChild(tbl);
                    var ftr = document.createElement('div'); ftr.className = 'tree-footer'; ftr.innerHTML = '<span>🪵 ' + tData.logsCount + ' Logs</span><span>Total Volume: ' + tData.totalVolume + ' m³</span>'; treeBlock.appendChild(ftr);
                    wrapper.appendChild(treeBlock);
                }
            }

            if (!treeMode) {
                var normalWrap = document.createElement('div'); normalWrap.className = 'normal-table-wrap';
                var tbl = document.createElement('table'); tbl.innerHTML = '<thead><tr><th># Serial</th><th>Length (A)</th><th>Girth (B)</th><th>Volume (C)</th></tr></thead>';
                var tbody = document.createElement('tbody');
                structuredTreeData[0].logs.forEach(function(log) {
                    var tr = document.createElement('tr'); tr.innerHTML = '<td>' + log.index + '</td><td>' + log.length + '</td><td>' + log.girth + '</td><td>' + log.volume + '</td>'; tbody.appendChild(tr);
                });
                tbl.appendChild(tbody); normalWrap.appendChild(tbl); wrapper.appendChild(normalWrap);
            }

            document.getElementById('summaryBox').innerText = displayGrandSummary;
            document.getElementById('loadingMsg').style.display = 'none';
            document.getElementById('summaryBox').style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'block';
        } else {
            calculateFallback();
        }
        }

        function calculateFallback() {
        var target    = parseFloat(document.getElementById('target').value);
        var totalLogs = parseInt(document.getElementById('totalLogs').value);
        var minG      = parseFloat(document.getElementById('minB').value);
        var maxG      = parseFloat(document.getElementById('maxB').value);
        var aVals     = getSelectedLengths();
        var numTreesVal = document.getElementById('numTrees').value.trim();
        var treeMode    = numTreesVal !== '';
        var totalTrees = treeMode ? parseInt(numTreesVal) : 1;

        var base = Math.floor(totalLogs / totalTrees);
        var treeLogsDistribution = [];
        for(var t=0; t<totalTrees; t++) treeLogsDistribution.push(base);
        var rem = totalLogs - (base * totalTrees);
        for(var r=0; r<rem; r++) treeLogsDistribution[r]++;

        var avgA = aVals.reduce(function(x, y) { return x + y; }, 0) / aVals.length;
        var idealB = Math.sqrt((target * 16) / (totalLogs * avgA));
        if(idealB < minG) idealB = minG;
        if(idealB > maxG) idealB = maxG;

        var currentVolSum = 0;
        var logGlobalCounter = 0;
        structuredTreeData = [];

        var wrapper = document.getElementById('tableWrapper');
        wrapper.innerHTML = '';

        for (var t = 0; t < totalTrees; t++) {
            var currentTreeLogLimit = treeLogsDistribution[t];
            var treeLogsArray = [];
            var treeVolSum = 0;

            for (var l = 0; l < currentTreeLogLimit; l++) {
                logGlobalCounter++;
                var a = aVals[Math.floor(Math.random() * aVals.length)];
                var finalB = parseFloat(idealB.toFixed(2));
                var displayC = truncDec((a * Math.pow(finalB, 2)) / 16, 4);

                if (logGlobalCounter === totalLogs) {
                    var neededC = target - currentVolSum;
                    if (neededC < 0) neededC = 0.0001;
                    displayC = truncDec(neededC, 4);
                    var computedB = Math.sqrt((neededC * 16) / a);
                    if(computedB < minG) computedB = minG;
                    if(computedB > maxG) computedB = maxG;
                    finalB = parseFloat(computedB.toFixed(2));
                }

                currentVolSum += parseFloat(displayC);
                treeVolSum += parseFloat(displayC);

                treeLogsArray.push({ index: logGlobalCounter, length: a, girth: finalB.toFixed(2), volume: displayC });
            }

            structuredTreeData.push({ treeNum: t + 1, logsCount: currentTreeLogLimit, totalVolume: truncDec(treeVolSum, 4), logs: treeLogsArray });

            if (treeMode) {
                var treeBlock = document.createElement('div');
                treeBlock.className = 'tree-block';
                var hdr = document.createElement('div'); hdr.className = 'tree-header'; hdr.innerHTML = '<span class="icon">🌳</span> Tree ' + (t + 1); treeBlock.appendChild(hdr);
                var tbl = document.createElement('table'); tbl.innerHTML = '<thead><tr><th># Serial</th><th>Length (A)</th><th>Girth (B)</th><th>Volume (C)</th></tr></thead>';
                var tbody = document.createElement('tbody');
                treeLogsArray.forEach(function(log) {
                    var tr = document.createElement('tr'); tr.innerHTML = '<td>' + log.index + '</td><td>' + log.length + '</td><td>' + log.girth + '</td><td>' + log.volume + '</td>'; tbody.appendChild(tr);
                });
                tbl.appendChild(tbody); treeBlock.appendChild(tbl);
                var ftr = document.createElement('div'); ftr.className = 'tree-footer'; ftr.innerHTML = '<span>🪵 ' + currentTreeLogLimit + ' Logs</span><span>Total Volume: ' + truncDec(treeVolSum, 4) + ' m³</span>'; treeBlock.appendChild(ftr);
                wrapper.appendChild(treeBlock);
            }
        }

        if (!treeMode) {
            var normalWrap = document.createElement('div'); normalWrap.className = 'normal-table-wrap';
            var tbl = document.createElement('table'); tbl.innerHTML = '<thead><tr><th># Serial</th><th>Length (A)</th><th>Girth (B)</th><th>Volume (C)</th></tr></thead>';
            var tbody = document.createElement('tbody');
            structuredTreeData[0].logs.forEach(function(log) {
                var tr = document.createElement('tr'); tr.innerHTML = '<td>' + log.index + '</td><td>' + log.length + '</td><td>' + log.girth + '</td><td>' + log.volume + '</td>'; tbody.appendChild(tr);
            });
            tbl.appendChild(tbody); normalWrap.appendChild(tbl); wrapper.appendChild(normalWrap);
        }

        displayGrandSummary = '✅ Total Logs: ' + totalLogs + ' | Total Volume: ' + truncDec(currentVolSum, 4) + ' m³';
        document.getElementById('summaryBox').innerText = displayGrandSummary;
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('summaryBox').style.display = 'block';
        document.getElementById('downloadBtn').style.display = 'block';
    }

    function trackUsage(aVals, target, totalLogs) {
        var device = navigator.userAgent;
        var now = new Date();
        var dateStr = now.getDate().toString().padStart(2,'0') + '/' + (now.getMonth()+1).toString().padStart(2,'0') + '/' + now.getFullYear() + ' ' + now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

        fetch('https://ipapi.co/json/')
            .then(function(r){ return r.json(); })
            .then(function(geo) {
                sendPayload({ datetime: dateStr, lengths: aVals.join(', '), target: target, rows: totalLogs, device: device, city: geo.city || 'Unknown', region: geo.region || 'Unknown' });
            })
            .catch(function() {
                sendPayload({ datetime: dateStr, lengths: aVals.join(', '), target: target, rows: totalLogs, device: device, city: 'Unknown', region: 'Unknown' });
            });
    }

    function sendPayload(payload) {
        fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    }

        function downloadPDF() {

            var footerMessages = [
                "by Deepak  |  Zameen pe chaand ka tukda  |  Anjali",

                "by Deepak  |  Ziddi par pyaari  |  Anjali",

                "by Deepak  |  Bejhijhak bebaak  |  Aashi",

                "ab finally  |  Muskura bhi do  |  Anjali"
            ];

            var pageW = doc.internal.pageSize.getWidth();
            var pageH = doc.internal.pageSize.getHeight();

            var currentY = 44; 
            var padding = 14;

            // --- STANDARD TRANSPARENT HIGH-FIDELITY FRAME ENGINE ---
            function drawPageFrame(pdfDoc, pageNum, totalPages) {
                // Top Signature Border Accent Line
                pdfDoc.setFillColor(141, 25, 36); 
                pdfDoc.rect(14, 10, pageW - 28, 1.2, 'F');

                // Main Title Header - Royal Sharp Text Appearance
                pdfDoc.setFont('times', 'bold');
                pdfDoc.setFontSize(16);
                pdfDoc.setTextColor(141, 25, 36); // Crimson Mahol Color
                pdfDoc.text('VOLUME HELPER REPORT', pageW / 2, 19, { align: 'center' });

                // Personalization Authorship Dynamic Credits Row
                pdfDoc.setFont('helvetica', 'bold');
                pdfDoc.setFontSize(9.5);
                pdfDoc.setTextColor(65, 75, 90);
                pdfDoc.text('Designed by Deepak Chauhan', 14, 26);
                
                pdfDoc.setFont('times', 'italic');
                pdfDoc.setFontSize(10.5);
                pdfDoc.setTextColor(141, 25, 36); // Matching Highlights
                pdfDoc.text('  |  Specially for Anjali Gangwar', 59, 26);

                pdfDoc.setFont('helvetica', 'normal');
                pdfDoc.setFontSize(9);
                pdfDoc.setTextColor(107, 114, 128);
                pdfDoc.text('Date: ' + dateStr, pageW - 14, 26, { align: 'right' });

                // Classic Top Summary Banner (Glass Border Wireframe Concept)
                pdfDoc.setFillColor(255, 255, 255);
                pdfDoc.setDrawColor(235, 215, 215);
                pdfDoc.setLineWidth(0.3);
                pdfDoc.roundedRect(14, 30, pageW - 28, 7.5, 1, 1, 'FD');
                
                pdfDoc.setFont('helvetica', 'bold');
                pdfDoc.setFontSize(9.5);
                pdfDoc.setTextColor(141, 25, 36);
                pdfDoc.text('Summary: ' + cleanSummaryLine, pageW / 2, 35, { align: 'center' });

                // Footer Axis Section Separator Divider Line
                pdfDoc.setDrawColor(225, 215, 215);
                pdfDoc.setLineWidth(0.25);
                pdfDoc.line(14, pageH - 14, pageW - 14, pageH - 14);

                // Page Counters & Luxury Rotator Poetry Messages
                pdfDoc.setFont('helvetica', 'normal'); 
                pdfDoc.setFontSize(8); 
                pdfDoc.setTextColor(156, 163, 175);
                pdfDoc.text('Page ' + pageNum + ' / ' + totalPages, pageW - 14, pageH - 8, { align: 'right' });

                var msgIdx = (pageNum - 1) % footerMessages.length;
                var currentMsg = footerMessages[msgIdx];
                pdfDoc.setFont('times', 'italic');
                pdfDoc.setFontSize(11);
                pdfDoc.setTextColor(141, 25, 36); // Crimson Luxury Sparkle Font
                pdfDoc.text(currentMsg, pageW / 2, pageH - 8, { align: 'center' });
            }

            // --- STANDARD SEQUENTIAL SAFE DATA RENDERING LOOP ---
            structuredTreeData.forEach(function(tree, treeIdx) {
                var cardHeaders = [['# Serial', 'Length (A)', 'Girth (B)', 'Volume (C)']];
                var cardRows = [];
                
                tree.logs.forEach(function(log) {
                    cardRows.push([log.index, log.length, log.girth, log.volume]);
                });

                var rowHeight = 7.0; 
                var headerHeight = 8.5;
                var totalTableH = (cardRows.length * rowHeight) + headerHeight;
                var blockH = totalTableH + (isTreeMode ? 21 : 4); 

                // Reliable Page Break Flow Management
                if (currentY + blockH > pageH - 18) {
                    doc.addPage();
                    currentY = 44; 
                }

                var startCardY = currentY;
                currentY += 2;

                if (isTreeMode) {
                    currentY += 4;
                    // Custom Sharp Vector Graphic: 🌳 Tree Icon
                    var tx = padding + 6;
                    var ty = currentY - 1.2;
                    doc.setFillColor(146, 64, 14); // Stem Base
                    doc.rect(tx - 0.5, ty + 0.4, 1.0, 2.2, 'F');
                    doc.setFillColor(34, 197, 94); // Organic Green Foliage Circles
                    doc.circle(tx, ty - 1.2, 1.5, 'F');
                    doc.circle(tx - 0.9, ty - 0.5, 1.1, 'F');
                    doc.circle(tx + 0.9, ty - 0.5, 1.1, 'F');

                    // Header Title Text
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(11);
                    doc.setTextColor(141, 25, 36);
                    doc.text('Tree ' + tree.treeNum, padding + 11, currentY);
                    
                    // Internal Micro Dashed Row Accent Accent
                    doc.setDrawColor(245, 225, 225);
                    doc.setLineDashPattern([1.5, 1.5], 0);
                    doc.line(padding + 4, currentY + 2.5, pageW - padding - 4, currentY + 2.5);
                    doc.setLineDashPattern([], 0); 
                    currentY += 5;
                }

                var internalCursorY = currentY;

                // High Clarity AutoTable Content Injection
                doc.autoTable({
                    head: cardHeaders,
                    body: cardRows,
                    startY: internalCursorY,
                    margin: { left: padding + 4, right: padding + 4 },
                    theme: 'striped',
                    styles: { fontSize: 9, cellPadding: 2.5, font: 'helvetica', lineColor: [255, 255, 255], lineWidth: 0.1 },
                    headStyles: { fillColor: [254, 242, 242], textColor: [141, 25, 36], fontStyle: 'bold', fontSize: 9 },
                    alternateRowStyles: { fillColor: [255, 253, 253] },
                    didDrawPage: function(data) {
                        currentY = data.cursor.y;
                    }
                });

                if (isTreeMode) {
                    currentY += 2;
                    // Soft Pink Container Summary Inside Individual Card
                    doc.setFillColor(254, 242, 242);
                    doc.setDrawColor(254, 226, 226);
                    doc.roundedRect(padding + 4, currentY, pageW - (padding * 2) - 8, 7, 1, 1, 'FD');
                    
                    // Custom Sharp Vector Graphic: 🪵 Wood Log Icon
                    var lx = padding + 7;
                    var ly = currentY + 2.2;
                    doc.setFillColor(180, 83, 9); // Outer Bark Color
                    doc.rect(lx + 0.8, ly, 3.2, 2.4, 'F');
                    doc.setFillColor(217, 119, 6); // Core Face Ring
                    doc.ellipse(lx + 0.8, ly + 1.2, 0.7, 1.2, 'F');
                    doc.setFillColor(251, 191, 36); // Center Growth Rings Ring
                    doc.ellipse(lx + 0.8, ly + 1.2, 0.35, 0.6, 'F');

                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(9);
                    doc.setTextColor(141, 25, 36);
                    doc.text(tree.logsCount + ' Logs', padding + 13, currentY + 4.8);
                    doc.text('Total Volume: ' + tree.totalVolume + ' m³ ', pageW - padding - 8, currentY + 4.8, { align: 'right' });
                    currentY += 10;
                } else {
                    currentY += 4;
                }

                var endCardY = currentY - 2;

                // --- PREMIUM POPUP BOX BOUNDARY DRAW LAYER ---
                doc.setDrawColor(254, 219, 219); 
                doc.setLineWidth(0.4);
                doc.roundedRect(padding, startCardY, pageW - (padding * 2), endCardY - startCardY, 3, 3, 'S');
                
                currentY += 6; 
            });

            // --- TWO-PASS CHASSIS DISPATCH SYSTEM (BACKGROUND FREE) ---
            var totalPagesCount = doc.internal.getNumberOfPages();
            for (var p = 1; p <= totalPagesCount; p++) {
                doc.setPage(p);
                drawPageFrame(doc, p, totalPagesCount);
            }

            doc.save('VolumeHelper_Deepak_Anjali.pdf');
        } catch (err) {
            alert("PDF Error: " + err.message);
            console.error(err);
        }
        }
